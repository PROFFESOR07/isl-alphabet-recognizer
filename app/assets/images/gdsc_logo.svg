<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <!-- Google Developer Brackets < > / -->
  <g transform="translate(6, 4)">
    <!-- Red Bracket < (Left) -->
    <path d="M14 6 L4 16 L14 26" stroke="#EA4335" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Blue Slash / (Center) -->
    <line x1="22" y1="28" x2="30" y2="4" stroke="#4285F4" stroke-width="4.2" stroke-linecap="round"/>
    <!-- Green Bracket > (Right) -->
    <path d="M38 6 L48 16 L38 26" stroke="#34A853" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Yellow Dot -->
    <circle cx="56" cy="24" r="3.2" fill="#FBBC04"/>
  </g>

  <!-- Clean GDSC Typography -->
  <text x="70" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="1">GDSC</text>
  <text x="116" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#94A9CC" letter-spacing="0.8">NITC</text>
</svg>
