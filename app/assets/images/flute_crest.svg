<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" fill="none">
  <defs>
    <linearGradient id="crest-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff2a3"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#805b00"/>
    </linearGradient>
    <linearGradient id="feather-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#00a86b"/>
      <stop offset="100%" stop-color="#0b1b3d"/>
    </linearGradient>
    <filter id="crest-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Peacock Feather behind Flute -->
  <g transform="translate(130, 28) rotate(-22)">
    <path d="M0 0 Q-15 -35 -25 -50" stroke="#f5cf68" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-25" cy="-45" rx="16" ry="24" fill="url(#feather-grad)" stroke="#ffd700" stroke-width="1.5" filter="url(#crest-glow)"/>
    <ellipse cx="-25" cy="-45" rx="10" ry="15" fill="#00d2ff" stroke="#ffd700" stroke-width="1"/>
    <circle cx="-25" cy="-45" r="6" fill="#0c1e4e"/>
    <circle cx="-23" cy="-47" r="2.5" fill="#ffd700"/>
  </g>

  <!-- Sacred Golden Flute (Bansuri) -->
  <rect x="25" y="44" width="210" height="15" rx="7.5" fill="url(#crest-gold)" stroke="#fff8dc" stroke-width="1.8" filter="url(#crest-glow)"/>
  
  <!-- Flute Decorative Rings -->
  <rect x="35" y="44" width="4" height="15" fill="#ff1744"/>
  <rect x="42" y="44" width="4" height="15" fill="#ff1744"/>
  <rect x="215" y="44" width="4" height="15" fill="#ff1744"/>
  <rect x="222" y="44" width="4" height="15" fill="#ff1744"/>

  <!-- Flute Holes -->
  <circle cx="90" cy="51.5" r="2.8" fill="#301c00"/>
  <circle cx="115" cy="51.5" r="2.8" fill="#301c00"/>
  <circle cx="140" cy="51.5" r="2.8" fill="#301c00"/>
  <circle cx="165" cy="51.5" r="2.8" fill="#301c00"/>
  <circle cx="190" cy="51.5" r="2.8" fill="#301c00"/>

  <!-- Silken Tassels with Pearl Drops -->
  <path d="M38 58 Q32 78 26 92" stroke="#ff1744" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="26" cy="94" r="4.5" fill="#ffd700" stroke="#ffffff" stroke-width="1"/>
  
  <path d="M46 58 Q44 75 42 90" stroke="#ff9100" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="92" r="3.5" fill="#ffd700" stroke="#ffffff" stroke-width="1"/>
</svg>
