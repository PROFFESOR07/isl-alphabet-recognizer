<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" fill="none">
  <defs>
    <radialGradient id="matki-clay" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff9955"/>
      <stop offset="50%" stop-color="#c6531e"/>
      <stop offset="100%" stop-color="#6e2504"/>
    </radialGradient>
    <linearGradient id="gold-rope" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#805b00"/>
    </linearGradient>
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hanging Sikhar Rope Strings -->
  <line x1="100" y1="0" x2="60" y2="70" stroke="url(#gold-rope)" stroke-width="2.5" stroke-dasharray="3 3"/>
  <line x1="100" y1="0" x2="140" y2="70" stroke="url(#gold-rope)" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="100" cy="5" r="4" fill="#ffd700"/>

  <!-- Earthen Matki Body -->
  <path d="M60 75 C40 100 40 145 75 165 C100 180 135 175 155 150 C170 130 165 95 140 75 Z" fill="url(#matki-clay)" stroke="#ffd700" stroke-width="2" filter="url(#m-glow)"/>

  <!-- Traditional Matki Patterns -->
  <path d="M54 110 C80 125 125 125 152 110" stroke="#ffd700" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M60 135 C85 150 120 150 145 135" stroke="#ffffff" stroke-width="1.5" fill="none"/>

  <!-- Matki Neck & Rim -->
  <ellipse cx="100" cy="72" rx="42" ry="12" fill="url(#gold-rope)" stroke="#ffffff" stroke-width="1.5"/>
  <ellipse cx="100" cy="72" rx="35" ry="8" fill="#541b02"/>

  <!-- Overflowing Pure White Butter (Makhan) -->
  <path d="M72 70 C72 52 90 45 100 45 C112 45 128 52 128 70 C128 78 120 86 112 86 C105 86 102 78 98 78 C92 78 88 88 80 88 C74 88 72 78 72 70 Z" fill="#ffffff" filter="url(#m-glow)"/>
  
  <!-- Makhan Butter Drips -->
  <path d="M80 86 Q78 105 82 115 Q86 105 84 86 Z" fill="#ffffff"/>
  <path d="M112 85 Q116 108 120 120 Q124 108 118 85 Z" fill="#ffffff"/>

  <!-- Holy Golden Peacock Feather resting on Matki -->
  <g transform="translate(100, 48) rotate(32)">
    <ellipse cx="15" cy="-20" rx="10" ry="16" fill="#00a86b" stroke="#ffd700" stroke-width="1.2"/>
    <ellipse cx="15" cy="-20" rx="6" ry="10" fill="#00e5ff" stroke="#ffd700" stroke-width="0.8"/>
    <circle cx="15" cy="-20" r="3.5" fill="#081845"/>
  </g>

  <!-- Animated Celestial Sparkles -->
  <path d="M45 45 L48 35 L51 45 L61 48 L51 51 L48 61 L45 51 L35 48 Z" fill="#f5cf68"/>
  <path d="M160 85 L162 78 L164 85 L171 87 L164 89 L162 96 L160 89 L153 87 Z" fill="#f5cf68"/>
  <circle cx="145" cy="40" r="3" fill="#ffffff" filter="url(#m-glow)"/>
</svg>
