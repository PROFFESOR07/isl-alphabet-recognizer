<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="40%" stop-color="#0080ff"/>
      <stop offset="80%" stop-color="#09206b"/>
      <stop offset="100%" stop-color="#051036"/>
    </linearGradient>
    <linearGradient id="crest-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#fff2a3"/>
    </linearGradient>
    <linearGradient id="feather-eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#00a86b"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <filter id="glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Crown Feathers -->
  <g stroke="url(#crest-grad)" stroke-width="1.8" stroke-linecap="round">
    <path d="M128 42 Q138 25 146 16"/>
    <path d="M124 40 Q130 20 135 10"/>
    <path d="M120 40 Q122 18 123 8"/>
    <path d="M116 42 Q112 22 110 12"/>
    <path d="M113 45 Q104 28 98 20"/>
  </g>
  <!-- Crown Fan Droplets -->
  <circle cx="146" cy="15" r="4.5" fill="#00d2ff" stroke="#ffd700" stroke-width="1.5" filter="url(#glow-p)"/>
  <circle cx="135" cy="9" r="4.5" fill="#00d2ff" stroke="#ffd700" stroke-width="1.5" filter="url(#glow-p)"/>
  <circle cx="123" cy="7" r="4.5" fill="#00d2ff" stroke="#ffd700" stroke-width="1.5" filter="url(#glow-p)"/>
  <circle cx="110" cy="11" r="4.5" fill="#00d2ff" stroke="#ffd700" stroke-width="1.5" filter="url(#glow-p)"/>
  <circle cx="98" cy="19" r="4.5" fill="#00d2ff" stroke="#ffd700" stroke-width="1.5" filter="url(#glow-p)"/>

  <!-- Plume Fans (Background Tail) -->
  <g opacity="0.95">
    <ellipse cx="60" cy="150" rx="35" ry="70" transform="rotate(-30 60 150)" fill="#024f54" stroke="#d4af37" stroke-width="1.2"/>
    <ellipse cx="75" cy="165" rx="30" ry="65" transform="rotate(-15 75 165)" fill="#036965" stroke="#ffd700" stroke-width="1.2"/>
    <ellipse cx="45" cy="160" rx="25" ry="60" transform="rotate(-45 45 160)" fill="#013b4e" stroke="#d4af37" stroke-width="1.2"/>
    
    <!-- Feather Eyes -->
    <ellipse cx="50" cy="115" rx="12" ry="18" fill="url(#feather-eye)" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="50" cy="115" r="6" fill="#0a1d4d"/>
    <circle cx="51" cy="113" r="2" fill="#00ffff"/>

    <ellipse cx="80" cy="125" rx="12" ry="18" fill="url(#feather-eye)" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="80" cy="125" r="6" fill="#0a1d4d"/>
    <circle cx="81" cy="123" r="2" fill="#00ffff"/>

    <ellipse cx="30" cy="135" rx="10" ry="16" fill="url(#feather-eye)" stroke="#ffd700" stroke-width="1.2"/>
    <circle cx="30" cy="135" r="5" fill="#0a1d4d"/>
  </g>

  <!-- Peacock Body -->
  <path d="M120 44 C132 44 140 54 138 68 C136 78 128 86 128 98 C128 120 148 145 140 175 C134 198 108 212 90 205 C70 198 75 165 85 140 C95 115 106 95 106 75 C106 58 110 44 120 44 Z" fill="url(#body-grad)" stroke="#d4af37" stroke-width="1.5" filter="url(#glow-p)"/>

  <!-- Wing Details -->
  <path d="M96 130 C108 135 125 150 115 185 C105 195 90 190 85 170 C80 152 88 138 96 130 Z" fill="#0c4a60" stroke="#f5cf68" stroke-width="1.2"/>
  <path d="M98 142 Q112 155 105 178" stroke="#f5cf68" stroke-width="1" stroke-linecap="round"/>
  <path d="M92 150 Q105 162 100 182" stroke="#f5cf68" stroke-width="1" stroke-linecap="round"/>

  <!-- Golden Neck Necklace (Kanthi) -->
  <path d="M112 76 C118 80 126 80 132 76" stroke="#ffd700" stroke-width="2" fill="none"/>
  <circle cx="122" cy="80" r="2.5" fill="#ff3366"/>
  <path d="M110 84 C118 90 128 90 134 84" stroke="#ffd700" stroke-width="1.5" fill="none"/>

  <!-- Graceful Beak & Eye -->
  <path d="M136 55 L158 60 L137 65 Z" fill="#f5cf68" stroke="#b8860b" stroke-width="1"/>
  <circle cx="128" cy="56" r="4.5" fill="#ffffff"/>
  <circle cx="129" cy="56" r="2.8" fill="#000000"/>
  <circle cx="130" cy="55" r="1.2" fill="#ffffff"/>
  <path d="M122 51 Q128 48 134 52" stroke="#00ffff" stroke-width="1.2" fill="none"/>
</svg>
